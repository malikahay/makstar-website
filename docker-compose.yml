# Go API + Postgres. The Next.js site runs separately (`npm run dev`) and proxies /api and /admin here.
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: makstar
      POSTGRES_PASSWORD: makstar
      POSTGRES_DB: makstar
    ports:
      - "5433:5432" # 5433 so it doesn't clash with a locally installed Postgres
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U makstar"]
      interval: 2s
      timeout: 3s
      retries: 20

  api:
    build: ./backend
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://makstar:makstar@db:5432/makstar?sslmode=disable
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env (32+ chars)}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@makstar.uz}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?set ADMIN_PASSWORD in .env}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
    ports:
      - "8080:8080"

volumes:
  pgdata:
